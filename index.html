<style>:root{--brand:#5F7A61;--brand-dk:#475C4A;--brand-lt:#E9F0E9;--brand-ink:#fff;--bg:#F3F5F2;--card:#fff;--ink:#262A27;--grey:#6B6B6B;--muted:#7A807B;--line:#E2E7E2;--ok:#2E7D4F;--ok-bg:#E2F3E8;--bad:#C0392B;--bad-bg:#FBE4E1;--warn:#B7791F;--warn-bg:#FDF1DC;--info:#2A5D9F;--info-bg:#E7F1FB;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(40,60,45,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--brand);padding:8px 12px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
header.top .logo{height:58px;width:auto;margin:-4px auto -4px 0;display:block;min-width:60px}
header.top .logo[src=""]{visibility:hidden}
header.top .htitle{order:3;flex:1 0 100%;display:flex;align-items:baseline;gap:8px;padding:5px 2px 0;border-top:1px solid var(--line)}
header.top .app{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--brand);text-transform:uppercase}
header.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header.top .hlink{font-size:13px;font-weight:700;color:var(--brand-dk);text-decoration:none;padding:4px 2px}
header.top button{background:var(--brand-lt);color:var(--brand-dk);border:0;border-radius:10px;padding:7px 11px;font-weight:700;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
#acct{display:flex;align-items:center;gap:8px}
#acct .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
#acct .who{line-height:1.15;text-align:right}#acct .who b{display:block;font-size:12.5px}#acct .who span{display:block;font-size:11px;color:var(--muted)} #acct button{margin-left:2px} header.top .htitle{min-height:33px;box-sizing:border-box} header.top .htitle .app{line-height:14.5px} header.top .htitle h1{line-height:21.75px} header.top .htitle .hlink{align-self:center} #n_client,#n_solution,#f_client,#f_solution{text-transform:uppercase} .solpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 6px} .solbox{display:flex;align-items:center;gap:8px;margin:0;padding:9px 10px;border:1.5px solid #CBD3CB;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;background:#fff} .solbox input{width:auto;margin:0;padding:0;accent-color:var(--brand)} .solbox:has(input:checked){border-color:var(--brand);background:var(--brand-lt)} .solother{text-transform:uppercase} @media (max-width:560px){header.top .logo{height:46px;margin:-2px auto -2px 0}}
@media (max-width:640px){#acct .who{display:none}}
main{max-width:900px;margin:0 auto;padding:14px 12px 120px}
footer.tag{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.4px;padding:4px 0 22px}footer.tag b{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.8px;color:var(--grey);font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #CBD3CB;border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(95,122,97,.22)}
input[type=checkbox],input[type=radio]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 16px;min-height:44px;font:inherit;font-size:15px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97);filter:brightness(.93)}.btn.sec{background:#EDF1ED;color:var(--ink)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{padding:8px 12px;font-size:13px;min-height:36px}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1 1 150px}.muted{color:var(--muted);font-size:12.5px}.hidden{display:none!important}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:999px;background:#ECEFEC;color:#4B524C;text-transform:uppercase;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.brand{background:var(--brand-lt);color:var(--brand-dk)}.chip.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stat{background:#F7F9F7;border:1.5px solid var(--line);border-radius:12px;padding:9px 2px 8px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}.stat span{display:block;line-height:1.2;margin-top:3px;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.2px}
.stat.on{border-color:var(--brand);background:var(--brand-lt)}
.stat.me b{color:var(--ok)}.stat.sales b{color:var(--warn)}.stat.client b{color:var(--info)}
.toolbar{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap;align-items:center}.toolbar input[type=search]{flex:2 1 160px;min-width:0}.toolbar select{flex:1 1 130px;min-width:0}
.toggle{display:flex;flex:1 0 100%;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--grey);margin:0}
.list{list-style:none;margin:0;padding:0}
.list li.pj{background:#fff;border:1px solid var(--line);border-left:5px solid #CBD3CB;border-radius:12px;padding:12px 10px 12px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;box-shadow:var(--shadow)}
.list li.pj.w-me{border-left-color:var(--ok)}.list li.pj.w-sales{border-left-color:#E0A33A}.list li.pj.w-client{border-left-color:#4F8AD1}.list li.pj.w-hold{border-left-color:#9AA19B;background:#FAFBFA}
.pj .main{flex:1;min-width:0}.pj .t1{font-size:15px}.pj .t1 b{font-weight:700}.pj .clock{font-size:12px;color:var(--grey);margin-top:6px}.pj .na{font-size:13px;color:var(--ink);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
details.done{margin-top:14px}details.done summary{cursor:pointer;font-weight:700;color:var(--grey);padding:10px 4px;font-size:13px}
.stagebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stagebar button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 1px;font:inherit;font-size:9.5px;font-weight:700;color:var(--grey);cursor:pointer;line-height:1.2;min-height:60px;min-width:0;overflow-wrap:anywhere}
.stagebar button b{display:block;font-size:15px;color:var(--ink)}
.stagebar button.on{background:var(--brand);border-color:var(--brand);color:#fff}.stagebar button.on b{color:#fff}
@media (max-width:480px){.stagebar{grid-template-columns:repeat(3,minmax(0,1fr))}.stagebar button{font-size:11px;min-height:58px}}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;font:inherit;font-size:13px;font-weight:700;color:var(--grey);cursor:pointer;min-height:44px}
.seg button.on{background:var(--brand-lt);border-color:var(--brand);color:var(--brand-dk)}
dl.facts{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;margin:0}dl.facts dt{font-size:12px;font-weight:600;color:var(--muted)}dl.facts dd{margin:0;word-break:break-word}
@media (max-width:480px){dl.facts{grid-template-columns:1fr}dl.facts dt{margin-top:6px}}
.tl{list-style:none;margin:0;padding:0}.tl li{border-left:3px solid var(--line);padding:2px 0 14px 12px;margin-left:5px;position:relative}
.tl li:before{content:"";position:absolute;left:-8px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--brand)}
.tl li.undone{opacity:.5}.tl .d{font-size:12px;color:var(--muted)}.tl .n{margin-top:2px;white-space:pre-wrap;word-break:break-word}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px max(12px, calc((100% - 900px) / 2 + 12px)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:25}
.actionbar .btn{flex:1;padding:12px 8px}
.fab{position:fixed;right:max(14px, calc((100% - 900px) / 2 + 14px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:24;box-shadow:0 6px 18px rgba(40,60,45,.35);border-radius:999px;padding:14px 20px}
.overlay{position:fixed;inset:0;background:rgba(20,28,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:6px}
.sheet .btns{display:flex;gap:8px;margin-top:16px}.sheet .btns .btn{flex:1}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}.chipsel button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--grey);cursor:pointer;min-height:40px}
.chipsel button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.hint{background:var(--info-bg);color:var(--info);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:90vw}
.toast.err{background:var(--bad)}
#wall{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#wall .box{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 22px;max-width:380px;width:100%;text-align:center}

/* ===== Solution Calc additions to the Forwardlog base styles ===== */
.tablewrap table{min-width:0}
.sync{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:5px 9px;white-space:nowrap}
.u{color:var(--muted);font-size:.82em;font-weight:600}
.bad{color:var(--bad)}
.back{background:none;border:0;font:inherit;font-size:20px;line-height:1;color:var(--brand-dk);padding:2px 6px 2px 0;cursor:pointer;align-self:center}
.card.hero{background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;border:0}

.big{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end}
.big .k b{display:block;font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.big .k span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.85;margin-top:3px}
.big .k.main b{font-size:44px}
.big .k .u{color:inherit;opacity:.8}
.warnbox{background:var(--warn-bg);color:#7A520F;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.warnbox ul{margin:4px 0 0;padding-left:18px}
/* calculator form */
.sec{margin-bottom:12px}
.sec h2 .cnt{float:right;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 12px}
.fld label{display:flex;justify-content:space-between;gap:6px;margin:8px 0 4px}
.fld label .u{white-space:nowrap}
.fld.look .ro{padding:11px 12px;border:1.5px dashed #CBD3CB;border-radius:11px;background:#F7F9F7;color:var(--grey);font-size:16px;min-height:47px}
.fld.look label::after{content:"from table";font-size:10px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.4px}
.fld.info label::after{content:"info only";font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fld input.chg{border-color:var(--warn);background:#FFFCF5}
.star{color:var(--bad);font-weight:800}
.fld input.need{border-color:var(--bad);background:#FFF8F7}
.fld input.need::placeholder{color:var(--bad);opacity:.75}
.seg.sizes{margin-top:0}

.res{width:100%;border-collapse:collapse;font-size:14px}
.res td{padding:7px 4px;border-bottom:1px solid var(--line)}
.res td.v{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.res tr.key td{background:var(--brand-lt)}
.res tr.key td.v{color:var(--brand-dk)}

.res .f{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.res.cmp td.v{width:28%}
.res th{text-align:right}.res th:first-child{text-align:left}
details.more summary{cursor:pointer;font-weight:700;color:var(--grey);font-size:13px;padding:4px 0}

.solgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.solbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:64px;font:inherit;color:var(--ink);cursor:pointer;text-decoration:none}

.list li.pj{align-items:center}

.tabs a{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--grey);text-decoration:none}

  function set(u) { $$('img.logo, #wall img').forEach(function (i) { i.src = u; }); }
  if (c) set(c);
  fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: 'getLogo', args: [] }), redirect: 'follow', credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.ok && j.result) { if (j.result !== c) ls(K + 'logo', j.result); set(j.result); } })
    .catch(function () { });
}

/* ---- Google sign-in (every page) ---- */
var _auth = null, _gsi = null, _waiters = [], _renew = null;
function readAuth() {
  try { var a = JSON.parse(ls(K + 'auth') || 'null'); if (a && a.token && a.exp - Date.now() > 60000) return a; } catch (e) { }
  return null;
}
function lastEmail() { try { return (JSON.parse(ls(K + 'auth') || 'null') || {}).email || ''; } catch (e) { return ''; } }
function loadGsi() {
  if (_gsi) return _gsi;
  _gsi = new Promise(function (res, rej) {
    if (window.google && google.accounts && google.accounts.id) return res();
    var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = function () { res(); }; s.onerror = function () { _gsi = null; rej(new Error('Could not load Google sign-in')); };
    document.head.appendChild(s);
  }).then(function () {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true, hd: HD, use_fedcm_for_prompt: true });
  });
  return _gsi;
}
function decodeJwt(t) {
  var p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(p + '==='.slice((p.length + 3) % 4)))));
}
function onCredential(resp) {
  try {
    var p = decodeJwt(resp.credential);
    if (p.hd !== HD) { toast('Please sign in with your @' + HD + ' account', true); return; }
    var prev = lastEmail();
    _auth = { token: resp.credential, exp: p.exp * 1000, name: p.name || p.email, email: p.email };
    ls(K + 'auth', JSON.stringify(_auth));
    if (prev && prev !== p.email) clearCaches();
    var w = $('#wall'); if (w) w.remove();
    scheduleRenew(); renderChip();
    var q = _waiters; _waiters = []; q.forEach(function (f) { f(_auth); });
  } catch (e) { toast('Sign-in failed. Try again.', true); }
}
function scheduleRenew() {
  clearTimeout(_renew);
  var ms = Math.max(15000, _auth.exp - Date.now() - 5 * 60000);
  _renew = setTimeout(function () { loadGsi().then(function () { google.accounts.id.prompt(); }).catch(function () { }); }, ms);
}
function showWall() {
  if ($('#wall')) return;
  var d = document.createElement('div'); d.id = 'wall';
  d.innerHTML = '<div class="box"><img alt="Forwardlog" src="' + esc(ls(K + 'logo') || '') + '"><h2>' + APP_TITLE + '</h2><p>Sign in with your @' + HD + ' Google account to continue.</p><div id="gbtn"></div><p id="wallerr" class="muted" style="margin:12px 0 0"></p></div>';
  document.body.appendChild(d);
  if (window.FL_LOADER_API) FL_LOADER_API.hideSplash();
  loadGsi().then(function () {
    google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 260 });
    google.accounts.id.prompt();
  }).catch(function (e) { $('#wallerr').textContent = e.message + '. Check your connection and reload.'; });
}
/* quiet=true: someone signed in here before, so try a silent sign-in first and only show the wall if it does not come back quickly */
function requireLogin(quiet) {
  _auth = readAuth();
  if (_auth) { scheduleRenew(); renderChip(); return Promise.resolve(_auth); }
  return new Promise(function (res) {
    _waiters.push(res);
    if (quiet) {
      loadGsi().then(function () { google.accounts.id.prompt(); }).catch(function () { });
      setTimeout(function () { if (!_auth) showWall(); }, 2500);
    } else showWall();
  });
}
function clearCaches() { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(K + 'c_') === 0) ls(k, null); }); }
function signOut() {
  if (!confirm('Sign out of ' + APP_TITLE + '?')) return;
  ls(K + 'auth', null); clearCaches(); _auth = null;
  loadGsi().then(function () { google.accounts.id.disableAutoSelect(); }).catch(function () { }).then(function () { location.reload(); });
}
function renderChip() {
  var a = $('#acct'); if (!a || !_auth) return;
  var ini = (_auth.name || '?').split(/\s+/).map(function (x) { return x[0]; }).join('').slice(0, 2).toUpperCase();
  a.innerHTML = '<span id="sync" class="sync hidden"></span><div class="av">' + esc(ini) + '</div><div class="who"><b>' + esc(_auth.name) + '</b><span>' + esc(_auth.email) + '</span></div><button id="so" type="button">Sign out</button>';
  $('#so').onclick = signOut; syncPill();
}

/* ---- API ---- */
function api(fn, args) {
  var a = _auth || readAuth();
  if (!a) { _auth = null; return requireLogin().then(function () { return api(fn, args); }); }
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args || [], token: a.token }), redirect: 'follow', credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.ok) return j.result;
      if (j.error === 'LOGIN_REQUIRED') { ls(K + 'auth', null); _auth = null; return requireLogin().then(function () { return api(fn, args); }); }
      var e = new Error(j.error || 'Request failed'); e.server = true; throw e;
    });
}
function fail(e) { toast((e && e.message) || 'Something went wrong', true); }

/* ---- saved data shown at start-up (keyed to the signed-in email) ---- */
function cacheGet(name) {
  try { var c = JSON.parse(ls(K + 'c_' + name) || 'null'); var em = (_auth && _auth.email) || lastEmail(); return c && c.email === em ? c.data : null; } catch (e) { return null; }
}
function cacheSet(name, data) {
  try { var em = (_auth && _auth.email) || lastEmail(), s = JSON.stringify({ email: em, at: Date.now(), data: data }); if (s.length < 3.5e6) ls(K + 'c_' + name, s); } catch (e) { }
}
/* reference data (constants + specs), shared by every page */
function refData() { return cacheGet('ref'); }
function setRefData(d) { if (d && d.constants) cacheSet('ref', { constants: d.constants, specs: d.specs }); }

/* ---- offline queue for saving estimates (server de-duplicates by opId) ---- */
function queue() { try { return JSON.parse(ls(K + 'queue') || '[]'); } catch (e) { return []; } }
function setQueue(q) { ls(K + 'queue', JSON.stringify(q)); syncPill(); }
function queueAdd(op) { var q = queue(); q.push(op); setQueue(q); }
function syncPill() {
  var el = $('#sync'); if (!el) return; var n = queue().length;
  el.classList.toggle('hidden', !n); el.textContent = n + ' pending'; el.title = n + ' estimate(s) waiting to be sent';
}
var _flushing = null;
function flushQueue() {
  if (_flushing) return _flushing;
  _flushing = (function next(sent) {
    var q = queue(); if (!q.length) return Promise.resolve(sent);
    var op = q[0];
    return api(op.fn, op.args).then(function (res) {
      setQueue(queue().filter(function (x) { return x.opId !== op.opId; }));
      if (op.onDone) try { window[op.onDone] && window[op.onDone](res); } catch (e) { }
      return next(sent.concat([res]));
    }, function (e) {
      if (e && e.server) {                                     // the server refused it: drop it and say why
        setQueue(queue().filter(function (x) { return x.opId !== op.opId; }));
        toast('Could not save "' + ((op.args[0] || {}).title || 'estimate') + '": ' + e.message, true);
        return next(sent);
      }
      return sent;                                             // offline: keep it for later
    });
  })([]).then(function (s) { _flushing = null; return s; }, function () { _flushing = null; return []; });
  return _flushing;
}
window.addEventListener('online', function () { if (queue().length) flushQueue(); });

/* ---- page start: logo, sign-in, then the page ---- */
function startPage(run) {
  loadLogo();
  var lg = $('#logoHome');
  if (lg && !lg.dataset.custom) lg.addEventListener('click', function (e) { if (window.goHome) { e.preventDefault(); goHome(); window.scrollTo(0, 0); } });
  var had = !!lastEmail();
  // saved data on screen: keep the logo splash up for a short moment (the same opening as the other portals), then show the page
  // while fresh data loads under the green top bar. With nothing saved, the loader drops the splash when the first reply arrives.
  var SPLASH_MIN = 1100;
  function reveal() {
    var m = $('#main'); if (!(m && m.textContent.trim() !== 'Loading…' && window.FL_LOADER_API)) return;
    setTimeout(FL_LOADER_API.hideSplash, Math.max(0, SPLASH_MIN - (window.performance ? performance.now() : 0)));
  }
  if (had && !readAuth()) { run(true); reveal(); }             // show saved data while a quiet sign-in runs
  requireLogin(had).then(function () { syncPill(); run(false); reveal(); if (queue().length) flushQueue(); });
}
function showAdminLink(me) { var a = $('#adminlink'); if (a && me && me.admin) a.classList.remove('hidden'); }
/* in-page ← : go back if we came from this portal, otherwise open the parent page */
function goBack(parentUrl) {
  var ref = document.referrer || '';
  if (ref.indexOf(location.origin + location.pathname.replace(/[^\/]*$/, '')) === 0 && history.length > 1) history.back();
  else location.href = parentUrl;
}
function openSheet(html, onClose) {
  var o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  function close() { o.remove(); document.removeEventListener('keydown', key); if (onClose) onClose(); }
  function key(e) { if (e.key === 'Escape') close(); }
  o.addEventListener('mousedown', function (e) { if (e.target === o) close(); });
  document.addEventListener('keydown', key);
  document.body.appendChild(o);
  var f = o.querySelector('input,select,textarea'); if (f && matchMedia('(min-width:641px)').matches) f.focus();
  o.close = close;
  return o;
}

/* ---- solutions ---- */
function sol(code) { return SC.solution(code); }
function statusChip(st) {
  var c = { Open: 'brand', Quoted: 'info', Won: 'ok', Lost: 'bad', 'On hold': 'warn', Archived: '' }[st] || '';
  return '<span class="chip ' + c + '">' + esc(st || 'Open') + '</span>';
}
function keyResultTxt(code, val) {
  var s = sol(code); if (!s) return '';
  return '<b>' + fmtNum(val) + '</b> ' + esc(s.keyLabel.toLowerCase());
}
function projectForm(p, statuses) {
  p = p || {};
  return '<label for="pf_name">Project name *</label><input id="pf_name" maxlength="120" value="' + esc(p.name) + '" required>' +
    '<div class="row"><div><label for="pf_client">Client</label><input id="pf_client" maxlength="120" value="' + esc(p.client) + '"></div>' +
    '<div><label for="pf_site">Site</label><input id="pf_site" maxlength="120" value="' + esc(p.site) + '"></div></div>' +
    '<div class="row"><div><label for="pf_pm">PM / presales</label><input id="pf_pm" maxlength="80" value="' + esc(p.pm) + '"></div>' +
    '<div><label for="pf_status">Status</label><select id="pf_status">' + (statuses || ['Open']).map(function (s) { return '<option' + (s === (p.status || 'Open') ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div></div>';
}
function readProjectForm(o, id) {
  return { projectId: id || '', name: $('#pf_name', o).value.trim(), client: $('#pf_client', o).value.trim(), site: $('#pf_site', o).value.trim(), pm: $('#pf_pm', o).value.trim(), status: $('#pf_status', o).value };
}

/* AIRROB sales summary: allowable totes first, total cells beside it, then the rack layout as a small table */
function isAirrob(code) { return /^airrob/.test(code || ''); }
function airrobSummary(v, title) {
  var n = function (x) { return fmtNum(x).replace(/<[^>]+>/g, ''); };
  var pct = v.maxTotes ? Math.round(v.allowTotes / v.maxTotes * 100) : 0;
  var row = function (label, totes, groups) { return '<tr><td>' + label + '</td><td>' + n(v.levels) + '</td><td>' + n(totes) + '</td><td>' + n(groups) + '</td></tr>'; };
  return '<h2>' + esc(title || 'AIRROB') + '</h2>' +
    '<div class="big"><div class="k main"><b>' + n(v.allowTotes) + '</b><span>Allowable totes for AIRROB</span></div>' +
    '<div class="k"><b>' + n(v.maxTotes) + '</b><span>Total cells for AIRROB' + (pct ? ' · ' + pct + '% usable' : '') + '</span></div></div>' +
    '<table class="asum"><thead><tr><th>Rack layout</th><th>Levels</th><th>Totes per group</th><th>Groups</th></tr></thead><tbody>' +
    row('Single-layer', v.totesSingleBay, v.singleBays) + row('Double-layer', v.totesDoubleBay, v.doubleBays) + '</tbody></table>';
}

</script>
<script>
var S = { d: null, q: '', st: '', rendered: false };
var CACHE = 'boot';
function goHome() { S.q = ''; S.st = ''; render(); }

function run(cachedOnly) {
  var c = cacheGet(CACHE);
  if (c && !S.rendered) { S.d = c; render(); }
  if (cachedOnly) return;
  return api('bootstrap').then(function (d) {
    cacheSet(CACHE, d); setRefData(d); S.d = d;
    if (!$('.overlay')) { var a = document.activeElement, had = a && a.id === 'q', pos = had ? a.selectionStart : 0; render(); if (had) { var q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } }
  }).catch(function (e) { if (!S.rendered) $('#main').innerHTML = '<div class="card"><h2>Could not load</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>'; else fail(e); });
}

function render() {
  var d = S.d; if (!d) return; S.rendered = true; showAdminLink(d.me);
  var q = S.q.toLowerCase(), list = d.projects.filter(function (p) {
    if (S.st ? p.status !== S.st : p.status === 'Archived') return false;
    return !q || [p.name, p.client, p.site, p.pm, p.projectId].join(' ').toLowerCase().indexOf(q) >= 0;
  });
  var est = d.projects.reduce(function (n, p) { return n + (p.estimates || 0); }, 0);
  var open = d.projects.filter(function (p) { return p.status === 'Open' || p.status === 'Quoted'; }).length;
  var h = '<div class="card hero"><h2>Solution estimates</h2><div class="big">' +
    '<div class="k main"><b>' + d.projects.length + '</b><span>Projects</span></div>' +
    '<div class="k"><b>' + open + '</b><span>Open or quoted</span></div>' +
    '<div class="k"><b>' + est + '</b><span>Saved estimates</span></div></div></div>';
  h += '<div class="card"><h2>Quick calculation</h2><div class="solgrid">' + SC.solutions.filter(function (s) { return !s.legacy; }).map(function (s) {
    return '<a class="solbtn" href="calc.html?s=' + s.code + '"><b>' + esc(s.short) + '</b><span>' + esc(s.keyLabel) + '</span></a>';
  }).join('') + '</div><p class="muted" style="margin:10px 0 0">Work out a number without a project. You can pick a project when you save.</p></div>';
  h += '<div class="toolbar"><input type="search" id="q" placeholder="Search projects, clients, sites" value="' + esc(S.q) + '" aria-label="Search projects">' +
    '<select id="stf" aria-label="Status"><option value="">Active</option>' + (d.statuses || []).map(function (s) { return '<option' + (s === S.st ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>' +
    '<button class="btn" id="newp" type="button">+ New project</button></div>';
  if (!list.length) h += '<div class="empty">' + (d.projects.length ? 'No projects match.' : 'No projects yet. Tap <b>+ New project</b> to add the first one.') + '</div>';
  else h += '<ul class="list">' + list.map(function (p) {
    var krs = Object.keys(p.latest || {}).map(function (c) { var l = p.latest[c], s = sol(c); return s ? '<span>' + esc(s.short) + ' <b>' + fmtNum(l.keyResult) + '</b></span>' : ''; }).join('');
    return '<li class="pj st-' + esc(String(p.status).replace(/\s/g, '.')) + '" data-id="' + esc(p.projectId) + '" tabindex="0" role="link"><div class="main">' +
      '<div class="t1"><b>' + esc(p.name) + '</b></div><div class="muted">' + esc([p.client, p.site].filter(Boolean).join(' · ') || p.projectId) + '</div>' +
      (krs ? '<div class="krs">' + krs + '</div>' : '') +
      '<div class="chips">' + statusChip(p.status) + '<span class="chip">' + (p.estimates || 0) + ' estimate' + (p.estimates === 1 ? '' : 's') + '</span><span class="chip">' + esc(ago(p.lastAt)) + '</span></div></div><span class="go" aria-hidden="true">›</span></li>';
  }).join('') + '</ul>';
  h += footerHtml();
  $('#main').innerHTML = h;
  $('#q').oninput = function () { S.q = this.value; renderListOnly(); };
  $('#stf').onchange = function () { S.st = this.value; render(); };
  $('#newp').onclick = newProject;
  $$('li.pj').forEach(function (li) {
    var go = function () { location.href = 'project.html?p=' + encodeURIComponent(li.dataset.id); };
    li.onclick = go; li.onkeydown = function (e) { if (e.key === 'Enter') go(); };
  });
}
function renderListOnly() { var a = document.activeElement, pos = a && a.selectionStart; render(); var q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { } }

function newProject() {
  var o = openSheet('<h3>New project</h3><div class="sub">A project holds the estimates for one client site.</div>' + projectForm({}, S.d.statuses) +
    '<div class="btns"><button class="btn sec" id="cx" type="button">Cancel</button><button class="btn" id="go" type="button">Create</button></div>');
  $('#cx', o).onclick = o.close;
  $('#go', o).onclick = function () {
    var p = readProjectForm(o); if (!p.name) { toast('Give the project a name', true); return; }
    api('saveProject', [p]).then(function (np) { o.close(); location.href = 'project.html?p=' + encodeURIComponent(np.projectId); }).catch(fail);
  };
}
startPage(run);
</script>
